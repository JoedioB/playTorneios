name: ci
permissions:
  contents: read
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main, 'ci/**']

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm --filter @playtorneios/web build
      - name: Teste de fumaça no navegador
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:web

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: ci, POSTGRES_DB: pt }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: ci
      PGDATABASE: pt
    steps:
      - uses: actions/checkout@v4
      - name: Migração e verificação do SQL em Postgres real
        run: |
          psql -v ON_ERROR_STOP=1 -q -f apps/api/migrations/001_init.sql
          psql -v ON_ERROR_STOP=1 -q -f apps/api/migrations/002_login_failures.sql
          psql -v ON_ERROR_STOP=1 -f apps/api/test/db-check.sql
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Testes de integração da API (Postgres real)
        env:
          TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/pt_api
        run: |
          createdb pt_api
          pnpm --filter @playtorneios/api test

  images:
    runs-on: ubuntu-latest
    needs: [verify, database]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build da API
        uses: docker/build-push-action@v6
        with: { context: ., file: apps/api/Dockerfile, push: false, cache-from: type=gha, cache-to: "type=gha,mode=max", tags: "playtorneios-api:ci", load: true }
      - name: Build do web
        uses: docker/build-push-action@v6
        with: { context: ., file: apps/web/Dockerfile, push: false, cache-from: type=gha, cache-to: "type=gha,mode=max", tags: "playtorneios-web:ci", load: true }
      - name: Valida os arquivos do Compose
        run: |
          cp .env.example .env && sed -i 's/^# DOMAIN=.*/DOMAIN=ci.example.com/' .env
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.tls.yml config -q
          docker compose --profile seed config -q
      - name: Sintaxe do nginx (os dois listeners)
        run: |
          docker run --rm --add-host api:127.0.0.1 playtorneios-web:ci nginx -t
      - name: Varredura de vulnerabilidades (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with: { image-ref: playtorneios-api:ci, severity: "CRITICAL,HIGH", exit-code: "1", ignore-unfixed: true }
      - name: Varredura de vulnerabilidades (Trivy, web)
        uses: aquasecurity/trivy-action@0.28.0
        with: { image-ref: playtorneios-web:ci, severity: "CRITICAL,HIGH", exit-code: "1", ignore-unfixed: true }
