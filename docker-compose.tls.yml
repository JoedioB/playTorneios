# HTTPS na frente da stack (Caddy + certificado automático).
#   docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d --build
# Defina no .env: DOMAIN=torneios.exemplo.com.br e ACME_EMAIL=voce@exemplo.com.br
# (para testar localmente: DOMAIN=localhost; acesse https://localhost).
services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?defina DOMAIN no arquivo .env}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      web: { condition: service_healthy }
    networks: [internal]

  api:
    environment:
      COOKIE_SECURE: "true"

  web:
    # Só o Caddy fala com o web; a porta 8080 deixa de ser publicada no host.
    ports: !reset []

volumes:
  caddy_data: {}
  caddy_config: {}
