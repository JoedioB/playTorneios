# Desenvolvimento local: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# O service worker fica desligado no servidor do Vite; para testar o modo offline use a imagem de produção.
services:
  db:
    ports: ["5432:5432"]

  api:
    command: ["node", "--watch", "src/server.ts"]
    read_only: false
    environment:
      NODE_ENV: development
      COOKIE_SECURE: "false"
    volumes:
      - ./packages:/repo/packages
      - ./apps/api/src:/repo/apps/api/src
      - ./apps/api/migrations:/repo/apps/api/migrations
    ports: ["3000:3000"]

  web:
    image: node:22-slim
    build: !reset null
    command: sh -c "corepack enable && pnpm install --filter @playtorneios/web... && pnpm --filter @playtorneios/web dev --host 0.0.0.0"
    working_dir: /repo
    read_only: false
    environment:
      API_URL: http://api:3000
    volumes:
      - .:/repo
    ports: ["5173:5173"]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      retries: 30
